name: Deploy su Aruba

# Carica il sito sull'hosting Aruba via FTPS a ogni push su main.
# Secrets richiesti (Settings > Secrets and variables > Actions):
#   ARUBA_FTP_SERVER    es. ftp.tuodominio.it
#   ARUBA_FTP_USERNAME  utente FTP del pannello Aruba
#   ARUBA_FTP_PASSWORD  password FTP
# Variabile richiesta (Settings > Secrets and variables > Actions > Variables):
#   ARUBA_FTP_DIR       cartella pubblica, su Aruba /www.tuodominio.it/ (con la barra finale)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aruba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i secrets
        env:
          SERVER: ${{ secrets.ARUBA_FTP_SERVER }}
          USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          DIR: ${{ vars.ARUBA_FTP_DIR }}
        run: |
          missing=""
          [ -z "$SERVER" ] && missing="$missing ARUBA_FTP_SERVER"
          [ -z "$USERNAME" ] && missing="$missing ARUBA_FTP_USERNAME"
          [ -z "$PASSWORD" ] && missing="$missing ARUBA_FTP_PASSWORD"
          [ -z "$DIR" ] && missing="$missing ARUBA_FTP_DIR(variabile)"
          if [ -n "$missing" ]; then
            echo "::error::Configurazione mancante:$missing"
            exit 1
          fi

      - name: Carica via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ARUBA_FTP_SERVER }}
          username: ${{ secrets.ARUBA_FTP_USERNAME }}
          password: ${{ secrets.ARUBA_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ vars.ARUBA_FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
