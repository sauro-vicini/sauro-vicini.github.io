name: Aggiorna blog

# Quando cambia un articolo in _posts/, rigenera le pagine del blog e le salva nel repo
# (così GitHub Pages pubblica sempre la versione aggiornata).

on:
  push:
    branches: [main]
    paths: ["_posts/**", "scripts/build-blog.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Salva le pagine generate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog feed.xml index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Rigenera il blog"
            git push
          fi
